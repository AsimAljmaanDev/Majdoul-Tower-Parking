<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقف برج مجدول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob"></div>
    <div class="blob"></div>

    <div class="page">
        <header>
            <div class="header-logos">
                <img src="Majdoul.png" alt="Majdoul Tower">
                <div class="toggle" id="themeToggle" onclick="toggleDark()">🌙</div>
                <img src="linkexpert.png" alt="Link Expert">
            </div>
            <h1>مواقف برج مجدول</h1>
        </header>

        <div class="container">
            <div id="loader" class="glass-loader">
                <div class="spinner"></div>
                <p>جاري تحميل البيانات...</p>
            </div>

            <div class="search-box" id="searchBox" style="display:none;">
                <input id="plateInput" type="text" placeholder="🔎 البحث برقم اللوحة" autocomplete="off">
                <input id="employeeInput" type="text" placeholder="👤 البحث باسم الموظف" autocomplete="off">
            </div>

            <div id="results"></div>
        </div>

        <footer>
            الموقع: برج مجدول <br>
            الشركة المشغلة للمرافق: <strong>خبير الربط - Link Expert</strong>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
